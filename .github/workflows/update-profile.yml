name: Update Profile Assets

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # Every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-assets
  cancel-in-progress: false

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate top-langs SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_top_langs.py

      - name: Generate contribution grid SVG
        run: python scripts/gen_contribution_grid.py

      - name: Generate custom header SVG
        run: echo "assets/header.svg is static — update manually if needed"
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config user.name "marcuslaf[bot]"
          git config user.email "166660635+marcuslaf@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Assets sem alteracoes - nada para commitar."
            exit 0
          fi
          git commit -m "chore: update profile assets [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push concluido na tentativa $attempt."
              exit 0
            fi
            echo "Push rejeitado (tentativa $attempt) - rebaseando em origin/main..."
            git pull --rebase --autostash origin main || git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "::error::Falha ao enviar os assets apos 5 tentativas."
          exit 1
